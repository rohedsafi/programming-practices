<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            
            align-items: center;
            max-width: 350px;
            text-align: center;
            margin: auto;
            margin-top: 50px;
            background-color: rgb(0, 0, 0);
            box-shadow: 10px 10px 15px hsla(0, 0%, 0%, 0.313);
            border-radius: 10px;
            padding: 25px;
        }
        h1{
            font-size: 25px;
            color: rgb(255, 255, 255);
        }
        #myText{
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        label{
            font-weight: bold;
            color: white;
        }
        button{
            color: rgb(0, 0, 0);
            background-color: rgb(255, 255, 255);
            border: none;
            font-size: 18px;
            margin-top: 15px;
            padding: 5px 7px;
            border-radius: 5px;
        }
        p{
            font-size: 20px;
            color: aliceblue;
        }
    

    </style>
</head>
<body>

    <div>

        <h1>Temperature Conversion</h1>
        <input type="text" id="myText" value=""><br>
        
        <input type="radio" id="toFahrenheit" name="unit" style="color: black;">
        <label for="toFahrenheit"> Celsius → Fahrenheit</label><br>
        
        <input type="radio" id="toCelsius" name="unit">
        <label for="toCelsius">Fahrenheit → Celsius</label><br>
        
        <button id="button">submit</button>
        
        <p id="result">0</p>
    </div>
    



    <script src="Temperature.js"></script>
     
    
</body>
</html>
