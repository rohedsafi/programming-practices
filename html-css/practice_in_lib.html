<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main-body{
            background-color: rgb(231, 231, 231);
            width: 250px;
            height: 350px;
            border-radius: 10px;
            color: azure;
            display: flex;
            flex-direction: column;
             justify-content: center;
            align-items: center;
            border: 1px solid rgba(0, 0, 255, 0.678);
            background-image: url(image/Web-page3.jpg);
             background-size: cover;
             background-position: center;
             margin: auto;
        }
        #profile-img{
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
        }
        #description{
            text-align: center;
            height: 120px;
            width: 200px;
            
        }
        img{  
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
           /* padding: 25px; */
           padding-bottom: 2px;
           outline: 3px solid rgb(87, 0, 145);;

        }
        button{
            padding: 8px;
            color: aliceblue;
            background-color: rgb(85, 3, 161);
            border-radius: 5px;
            border-style: none;
        }
        button:hover{
            background-color: rgba(120, 0, 176, 0.692);
        }


        </style>
</head>
<body>
    <div id="main-body">
        <div id="profile-img">
             <img src="image/web5.jpg" alt="">
        </div>
        <div id="description"> 
            <p>Name: Rohed Safi </p>
            <p style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10px;">
                Hello world I am going to learn HTML, CSS and JavaScript. </p>
        </div>
        <button>Read more</button>
    </div>
</body>
</html>
