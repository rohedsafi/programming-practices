<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async/Await and Promise Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            background: #f7f8fc;
            color: #1a202c;
        }
        .card {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08);
        }
        h1 {
            margin-bottom: 12px;
            font-size: 1.8rem;
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #1d4ed8;
        }
        pre {
            margin-top: 20px;
            padding: 16px;
            background: #eef2ff;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Async/Await + Promise Demo</h1>
        <p>Click the button to simulate a drink order. The code uses a Promise and async/await to show the order flow.</p>
        <button id="startButton">Start order</button>
        <pre id="log"></pre>  <!-- pre is used to display logs and code output. what is log? is a variable that stores the log messages -->
    </div>
    <script src="async-await-project.js"></script>
</body>
</html>
