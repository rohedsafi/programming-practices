<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Sign in</title>

    <style>

        body{
            background-image: url("../image/allison-saeng-B-38dDFfJPI-unsplash\(1\).jpg"); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main{
            background-color: rgb(0, 0 ,0, 0.4);
            width: 380px;
            height: 500px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;

            
        }

        .sub-main{
            width: 320px;
            height: 430px;
            /* border: 1px solid gray; */
            border-radius: 10px;
            padding: 15px;
        
            box-sizing: border-box;
            /* display: flex;
            align-items: center;
            justify-content: center; */
        }

        h2{
            text-align: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-bottom: 18px;
            margin-top: 0px;
            
        }
        .txt{
            font-size: 14px;
            text-align: center;
            color: white;
            margin-top: 5px;
            font-family: sans-serif;
        }
        div input{
            width: 90%;
            height: 35px;
            margin: 10px;
            border-radius: 10px;
            box-sizing: border-box;

        }

        input{
            padding-left: 13px;
            border: none;
        }

        div a{
            margin-top: 15px;
            margin-left: 95px;
            margin-right: 65px;
            color: rgb(197, 197, 197);
            font-size: 13px;
        }

        div button{
            background-color: rgb(95, 15, 198);
            color: white;
            border-radius: 10px;
            width: 90%;
            height: 35px;
            margin: 10px;
            margin-top: 18px;
            border: none;
            transition: opacity 0.3s;
        
        }

        div button:hover{
            opacity: 0.9;
            background-color: rgb(69, 8, 166);
        }

        .fa-brands{
            color: white;
        }
        .fa-brands:hover{
            color: rgb(197, 197, 197);
            width: 25px;
            
        }
        .icon{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .login{
            display: inline-block;
            height: 10px;
            margin-left: 90px;
            margin-right: auto;
        }
        .login p{
            color: white; 
            font-size: 11px; 
            margin-right: 3px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .login p a{
            margin: 0;
            font-size: 12px;
            
        }

    </style>
</head>
<body>

    <div class="main">
        <div class="sub-main">
            <h2>Sign up</h2>
            <p class="txt">Please enter your Sign-up and Password</p>
            <input type="text" placeholder="Username or Email" id="UserInput" required >
            <input type="text" placeholder="Password" id="PassInput" required >
            <input type="text" placeholder="Confirm Password">
            <a href="#">Forget password?</a>
            <button id="SignButton" onclick="clearInputs()">SIGN UP</button>
            <p style="color: rgb(207, 205, 205); margin-top: 0; text-align: center; font-size: 12px;">OR</p>
            <hr>
            <div class="icon">
                <i class="fa-brands fa-google"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-twitter"></i>

            </div>
            <div class="login">
                <p>Already a user? <a href="Log-in.html">LOGIN</a></p>
                
            </div>
            
        </div>
        
    </div>
    
    <script src="Javascript/Sign_Login.js"> </script>
</body>
</html>
