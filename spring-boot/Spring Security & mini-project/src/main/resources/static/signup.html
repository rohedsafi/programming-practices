<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
<main class="auth-card">
    <p class="eyebrow">SECURITY PRACTICE</p>
    <h1>Create your account</h1>
    <p class="intro">Choose a username and password to get started.</p>

    <form data-auth-form="signup">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               required minlength="1" maxlength="100">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="8">

        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password"
               autocomplete="new-password" required minlength="8">

        <button type="submit">Create account</button>
        <p class="message" data-message aria-live="polite" role="status"></p>
    </form>

    <p class="switch-link">Already registered? <a href="login.html">Sign in</a></p>
</main>
</body>
</html>
