<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Practice</title>
</head>
<body>
    <h1 align="center">Teachers Salary</h1>
    <table bgcolor="black" align="center" width="400px">
        <caption>Teacher Salary</caption>
        <tr bgcolor="lightblue">
            <th width="100px">Name</th>
            <th width="100px">Age</th>
            <th width="100px">Salary</th>
            <th width="100px">Month</th>
        </tr>
        <tr bgcolor="lightgray" align="center">
            <td>Ali Raza</td>
            <td>Khanzada</td>
            <td>28100af</td>
            <td>Nov</td>
        </tr>
         <tr bgcolor="lightgray" align="center">
            <td>Jamal</td>
            <td>Safi</td>
            <td>25400af</td>
            <td>Nov</td>
        </tr>
         <tr bgcolor="lightgray" align="center">
            <td>Jawad</td>
            <td>Zaland</td>
            <td>700$</td>
            <td>Nov</td>
        </tr>
    </table>
</body>
</html>
